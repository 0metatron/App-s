<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robô do Shake do Nog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma conversa de chat ocupando a tela (celular primeiro); faixa de demonstração no topo; o cartão do pedido que chega ao dono aparece no fim. Tema único. */
:root{
  --fundo:#ece5dd;
  --topo:#0f5c4d;
  --eu:#d9fdd3;
  --bot:#ffffff;
  --tinta:#111b21;
  --apagado:#667781;
  --verde:#16a34a;
  --rosa:#ff5c8a;
  --amarelo:#ffc93c;
  --f:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:#1d2b2f;color:var(--tinta);display:flex;justify-content:center}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--fundo);position:relative}
.demo{background:var(--amarelo);color:#3a2a00;font-size:12px;font-weight:600;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;justify-content:space-between}
.demo button{background:rgba(0,0,0,.12);border:0;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.hd{background:var(--topo);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--rosa),var(--amarelo));display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.hd b{display:block;font-size:16px}
.hd small{font-size:12px;opacity:.85}
.msgs{flex:1;overflow-y:auto;padding:12px 10px 6px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dia{align-self:center;background:#fff;color:var(--apagado);font-size:11px;font-weight:600;border-radius:8px;padding:4px 10px;margin:4px 0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.b{max-width:84%;padding:7px 10px 18px;border-radius:10px;font-size:14.5px;line-height:1.4;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-line;animation:in .18s ease-out}
.b.bot{align-self:flex-start;background:var(--bot);border-top-left-radius:2px}
.b.eu{align-self:flex-end;background:var(--eu);border-top-right-radius:2px}
.b{min-width:76px}
.card b{white-space:nowrap}
.b time{position:absolute;right:8px;bottom:3px;font-size:10px;color:var(--apagado)}
.b.eu time::after{content:" ✓✓";color:#53bdeb}
.b b{font-weight:700}
.card{margin-top:6px;border:1px solid #e9edef;border-radius:8px;overflow:hidden}
.card div{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-top:1px solid #f0f2f5;font-size:13.5px}
.card div:first-child{border-top:0}
.card i{font-style:normal;color:var(--apagado)}
.fl{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.digitando{align-self:flex-start;background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:4px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.digitando i{width:7px;height:7px;border-radius:50%;background:#9aa6ac;animation:pulo 1s infinite}
.digitando i:nth-child(2){animation-delay:.15s}.digitando i:nth-child(3){animation-delay:.3s}
@keyframes pulo{0%,60%,100%{transform:none;opacity:.6}30%{transform:translateY(-4px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ops{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 4px;justify-content:flex-end}
.ops button{background:#fff;border:1px solid #cfd8dc;color:var(--topo);font-weight:700;font-size:13.5px;border-radius:999px;padding:8px 13px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.ops button:active{transform:scale(.97)}
.bar{display:flex;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#f0f2f5}
.bar input{flex:1;border:0;border-radius:22px;padding:11px 14px;background:#fff;min-width:0;font-size:15px}
.bar input:focus{outline:2px solid var(--topo)}
.bar button{width:44px;height:44px;border-radius:50%;border:0;background:var(--topo);color:#fff;display:grid;place-items:center;flex:none}
.bar svg{width:20px;height:20px}
.dono{margin:8px 0 4px;align-self:stretch;background:#fff;border-radius:12px;border:2px dashed var(--topo);padding:12px;font-size:13.5px;white-space:normal;animation:in .25s ease-out}
.dono h3{margin:0 0 6px;font-size:14px;color:var(--topo)}
.dono p{margin:8px 0 0;color:var(--apagado);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="demo"><span>Demonstração · robô de atendimento feito por <a href="index.html" style="color:inherit">Cesar</a></span><button id="reset">Recomeçar</button></div>
  <header class="hd"><div class="av" aria-hidden="true">SN</div><div><b>Shake do Nog</b><small id="status">online · atendente virtual</small></div></header>
  <section class="msgs" id="msgs" aria-live="polite"></section>
  <div class="ops" id="ops"></div>
  <form class="bar" id="form" autocomplete="off"><input id="txt" placeholder="Escreva uma mensagem" aria-label="Escreva uma mensagem"><button aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.5-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.3 1l1 6.2c.1.5.5.9 1 .9l8.4.8-8.4.8c-.5.1-.9.4-1 .9l-1 6.2c-.1.7.6 1.3 1.3 1z"/></svg></button></form>
</main>
<script>
(function(){
"use strict";
const SABORES={maracuja:{n:'Maracujá',c:'#f5d76e',d:'fruta de verdade, com as sementinhas'},morango:{n:'Morango',c:'#ff8fb1',d:'cremoso, do jeitinho que a família ama'}};
const PRECO=20,TAXA_SANTANA=10;
const $=id=>document.getElementById(id);
const M=$('msgs'),OPS=$('ops');
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2});
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P,etapa,fila=Promise.resolve(),selos=3;

function rolar(){M.scrollTop=M.scrollHeight}
function eu(t){const d=document.createElement('div');d.className='b eu';d.innerHTML=esc(t)+'<time>'+hora()+'</time>';M.appendChild(d);rolar()}
function bot(html,ms){fila=fila.then(()=>new Promise(r=>{const t=document.createElement('div');t.className='digitando';t.innerHTML='<i></i><i></i><i></i>';M.appendChild(t);rolar();$('status').textContent='digitando…';
  setTimeout(()=>{t.remove();const d=document.createElement('div');d.className='b bot';d.innerHTML=html+'<time>'+hora()+'</time>';M.appendChild(d);rolar();$('status').textContent='online · atendente virtual';r()},ms||Math.min(1400,500+html.length*6))}));return fila}
function bloco(html){fila=fila.then(()=>{const d=document.createElement('div');d.className='dono';d.innerHTML=html;M.appendChild(d);rolar()});return fila}
function ops(L){OPS.innerHTML='';fila.then(()=>{OPS.innerHTML=L.map(([k,t])=>`<button type="button" data-k="${k}">${t}</button>`).join('');rolar()})}
function menu(){etapa='menu';ops([['cardapio','📋 Ver cardápio'],['pedir','🥤 Fazer pedido'],['entrega','🛵 Entrega e taxa'],['lucas','🙋 Falar com o Lucas']])}
function itensTxt(){return Object.entries(P.itens).filter(([,q])=>q>0).map(([k,q])=>`${q}x ${SABORES[k].n}`).join(' + ')}
function qtd(){return Object.values(P.itens).reduce((a,b)=>a+b,0)}
function total(){return qtd()*PRECO+(P.cidade==='santana'?TAXA_SANTANA:0)}

function inicio(){M.innerHTML='<div class="dia">HOJE</div>';OPS.innerHTML='';fila=Promise.resolve();P={itens:{maracuja:0,morango:0},sabor:null,cidade:null,end:'',pag:null,nome:''};
  bot('Opa! 👋 Aqui é o atendente virtual do <b>Shake do Nog</b> 🥤\nO verdadeiro sabor amapaense! Pediu, provou, viciou 🤤\n\nComo posso te ajudar?',700);menu()}

function cardapio(){bot(`Nossos shakes de <b>500 ml</b>, feitos com fruta de verdade e leite Ninho:<div class="card">${Object.values(SABORES).map(s=>`<div><span><span class="fl" style="background:${s.c}"></span><b>${s.n}</b><br><i>${s.d}</i></span><b>${brl(PRECO)}</b></div>`).join('')}</div>`);bot('Entrega <b>grátis em qualquer bairro de Macapá</b> 🛵 e R$ 10 pra Santana.');ops([['pedir','🥤 Quero pedir'],['entrega','🛵 Entrega'],['menu','↩ Menu']])}
function entrega(){bot('🛵 Entrega <b>grátis em qualquer bairro de Macapá</b>.\nPra <b>Santana</b> a taxa é de <b>R$ 10</b>.\n\nAssim que o pedido chega, o Lucas confirma o horário da entrega com você.');ops([['pedir','🥤 Fazer pedido'],['menu','↩ Menu']])}
function lucas(){bot('Beleza! Já chamei o Lucas 🙋‍♂️ Ele te responde aqui mesmo assim que puder.\n\nEnquanto isso, quer ir adiantando seu pedido?');ops([['pedir','🥤 Adiantar pedido'],['menu','↩ Menu']])}
function pedir(){etapa='sabor';bot(qtd()?`Até agora: <b>${itensTxt()}</b>.\nQual sabor você quer adicionar?`:'Bora! 🤤 Qual sabor vai ser?');ops([['s:maracuja','🟡 Maracujá'],['s:morango','🩷 Morango'],...(qtd()?[['fechar','✅ Só isso']]:[])])}
function escolheSabor(k){P.sabor=k;etapa='qtd';bot(`<b>${SABORES[k].n}</b>, boa escolha! Quantos?`);ops([['q:1','1'],['q:2','2'],['q:3','3'],['q:4','4'],['q:6','6']])}
function escolheQtd(n){P.itens[P.sabor]+=n;etapa='mais';bot(`Anotado: <b>${itensTxt()}</b> 🥤\nVai querer mais algum sabor?`);ops([['pedir','➕ Adicionar outro'],['fechar','✅ Só isso']])}
function fechar(){if(!qtd())return pedir();etapa='cidade';bot('Show! A entrega é pra onde?');ops([['c:macapa','📍 Macapá (grátis)'],['c:santana','📍 Santana (+R$ 10)']])}
function cidade(k){P.cidade=k;etapa='end';bot('Me manda o <b>endereço</b> com bairro e um ponto de referência 🏠');ops([])}
function endereco(t){P.end=t;etapa='pag';bot('Perfeito! E o pagamento vai ser como?');ops([['p:pix','💠 Pix'],['p:dinheiro','💵 Dinheiro na entrega']])}
function pagamento(k){P.pag=k;etapa='nome';bot('Pra finalizar: qual o seu <b>nome</b>?');ops([])}
function nome(t){P.nome=t.split(' ')[0].slice(0,20);etapa='conf';
  bot(`Confere aí, ${esc(P.nome)} 👇<div class="card"><div><span>${esc(itensTxt())}</span><b>${brl(qtd()*PRECO)}</b></div><div><span>Entrega · ${P.cidade==='santana'?'Santana':'Macapá'}</span><b>${P.cidade==='santana'?brl(TAXA_SANTANA):'grátis'}</b></div><div><span><b>Total</b></span><b>${brl(total())}</b></div><div><span><i>${esc(P.end)}</i></span><i>${P.pag==='pix'?'Pix':'Dinheiro'}</i></div></div>`);
  ops([['confirma','✅ Confirmar pedido'],['refaz','✏️ Mudar']])}
function confirma(){etapa='fim';selos=Math.min(10,selos+qtd());
  if(P.pag==='pix')bot(`Pedido confirmado! 🎉\n\nChave Pix do Shake do Nog: <b>(chave do Lucas aqui)</b>\nValor: <b>${brl(total())}</b>\nDepois é só mandar o comprovante aqui.`);
  else bot(`Pedido confirmado! 🎉\nSepara <b>${brl(total())}</b> pro entregador. Se precisar de troco, me avisa.`);
  bot(selos>=10?'🎁 Você completou o cartão fidelidade! O próximo shake é <b>por nossa conta</b>.':`⭐ Cartão fidelidade: você tem <b>${selos} de 10</b> selos. Faltam ${10-selos} pro seu shake grátis!`);
  bot('O Lucas já recebeu seu pedido e vai confirmar o horário da entrega. Valeu demais! 🥤🤪');
  bloco(`<h3>📲 O que chega no celular do Lucas</h3><div class="card"><div><span>Cliente</span><b>${esc(P.nome)}</b></div><div><span>Pedido</span><b>${esc(itensTxt())}</b></div><div><span>Entrega</span><b>${P.cidade==='santana'?'Santana':'Macapá'}</b></div><div><span>Endereço</span><b style="text-align:right">${esc(P.end)}</b></div><div><span>Pagamento</span><b>${P.pag==='pix'?'Pix (aguardando comprovante)':'Dinheiro'}</b></div><div><span>Total</span><b>${brl(total())}</b></div></div><p>O robô fez o atendimento inteiro sozinho. O Lucas só separa e entrega. No fim do mês, ele também vê quantos shakes vendeu, quais sabores saem mais e quem são os clientes que mais compram.</p>`);
  ops([['novo','🔁 Fazer outro pedido'],['menu','↩ Menu']])}

function acao(k,rot){if(rot)eu(rot);
  if(k==='menu'){bot('O que mais posso fazer por você?');menu()}
  else if(k==='cardapio')cardapio();else if(k==='entrega')entrega();else if(k==='lucas')lucas();
  else if(k==='pedir')pedir();else if(k==='fechar')fechar();
  else if(k.startsWith('s:'))escolheSabor(k.slice(2));
  else if(k.startsWith('q:'))escolheQtd(Number(k.slice(2)));
  else if(k.startsWith('c:'))cidade(k.slice(2));
  else if(k.startsWith('p:'))pagamento(k.slice(2));
  else if(k==='confirma')confirma();
  else if(k==='refaz'){P.itens={maracuja:0,morango:0};pedir()}
  else if(k==='novo'){P={itens:{maracuja:0,morango:0},sabor:null,cidade:null,end:'',pag:null,nome:''};pedir()}}

function norm(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function livre(t){const n=norm(t);
  if(etapa==='end')return endereco(t);
  if(etapa==='nome')return nome(t);
  if(etapa==='qtd'){const m=n.match(/\d+/);if(m&&+m[0]>0&&+m[0]<=30)return escolheQtd(+m[0])}
  const sab=/maracuj/.test(n)?'maracuja':/morang/.test(n)?'morango':null;
  if(sab&&(etapa==='sabor'||etapa==='menu'||etapa==='mais'||etapa==='fim')){const m=n.match(/\d+/);P.sabor=sab;if(m&&+m[0]>0&&+m[0]<=30)return escolheQtd(+m[0]);return escolheSabor(sab)}
  if(/santana/.test(n)&&etapa==='cidade')return cidade('santana');
  if(/macapa/.test(n)&&etapa==='cidade')return cidade('macapa');
  if(etapa==='pag'&&/pix/.test(n))return pagamento('pix');
  if(etapa==='pag'&&/dinheiro|especie/.test(n))return pagamento('dinheiro');
  if(etapa==='conf'&&/^(sim|ok|isso|confirm|pode|fechado|beleza)/.test(n))return confirma();
  if(/card|sabor|preco|quanto|valor|tem de que/.test(n))return cardapio();
  if(/entreg|taxa|frete|santana|bairro/.test(n))return entrega();
  if(/quero|pedir|pedido|manda|me ve/.test(n))return pedir();
  if(/lucas|atendente|humano|pessoa/.test(n))return lucas();
  if(/^(oi|ola|opa|eae|e ai|bom dia|boa tarde|boa noite)/.test(n)){bot('Opa, tudo certo? 😄 Me diz como posso te ajudar:');return menu()}
  if(/obrigad|valeu|vlw/.test(n)){bot('Nós que agradecemos! 🥤🤪');return}
  bot('Hmm, essa eu não entendi 😅\nToca numa das opções aqui embaixo ou escreve, por exemplo, "cardápio" ou "quero 2 de morango".');
  if(etapa==='menu'||etapa==='fim')menu()}

OPS.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,rot=b.textContent.replace(/^\W+\s*/,'').trim()||b.textContent;OPS.innerHTML='';acao(k,rot)});
$('form').addEventListener('submit',e=>{e.preventDefault();const t=$('txt').value.trim();if(!t)return;$('txt').value='';OPS.innerHTML='';eu(t);livre(t)});
$('reset').addEventListener('click',inicio);
inicio();
})();
</script>
</body>
</html>
